# Render Blueprint: one free web service running the FastAPI app.
# Secrets use sync: false, so Render asks for them in the dashboard
# and they never live in this repo.
services:
  - type: web
    name: agent-allowance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Render's disk is ephemeral: the demo reseeds itself on restart.
      - key: DB_PATH
        value: /tmp/agent_allowance.db
      - key: PAYMENTS_BACKEND
        value: paypal
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SUPPLIER_EMAILS
        sync: false
      # LLM_API_KEY / LLM_BASE_URL / LLM_MODEL: add in the dashboard
      # once the Groq key is tested. Unset = rule-based agent.
