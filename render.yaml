# Render Blueprint: one free web service running the FastAPI app.
# Secrets use sync: false, so Render asks for them in the dashboard
# and they never live in this repo.
services:
  - type: web
    name: agent-allowance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PAYMENTS_BACKEND
        value: paypal
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SUPPLIER_EMAILS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
